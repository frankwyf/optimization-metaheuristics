name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot]"

      - name: Compile all maintained sources
        run: python -m compileall general.py final scripts metaheuristics

      - name: Build source and wheel distributions
        run: python -m build

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=metaheuristics \
            --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=85

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check metaheuristics/ scripts/ tests/ examples/ tools/ --output-format=github

  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[plot]"
      - name: List algorithms
        run: python scripts/run.py --list
      - name: SA quick run (no plot)
        run: python scripts/run.py sa --seed 42 --runs 1 --no-plot --quick
      - name: PSO quick run (no plot)
        run: python scripts/run.py pso --seed 42 --runs 1 --no-plot --quick
      - name: GA quick run (no plot)
        run: python scripts/run.py ga --seed 42 --runs 1 --no-plot --quick
      - name: DE quick run (no plot)
        run: python scripts/run.py de --seed 42 --runs 1 --no-plot --quick

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core and test dependencies
        run: |
          python -m pip install -e ".[dev]"
      - name: Run full suite without plotting extras
        run: python -m pytest tests/ -q
      - name: Run a headless benchmark on the platform
        run: python scripts/run.py de --problem sphere_2d --seed 42 --runs 1 --pop-size 8 --iterations 2 --no-plot

  plotting:
    name: Optional plotting smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting extra
        run: python -m pip install -e ".[plot]"
      - name: Render headless convergence and statistics plots
        env:
          MPLBACKEND: Agg
        run: python scripts/run.py de --problem sphere_2d --seed 42 --runs 1 --pop-size 8 --iterations 2 --output-dir "$RUNNER_TEMP/metaheuristics-plots"

  distribution:
    name: Installed wheel and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Validate release metadata and build from source archive
        run: |
          python tools/check_release.py
          python -m build
          python -m twine check --strict dist/*
      - name: Install and smoke-test wheel without source imports or plotting extras
        run: |
          python -m pip install dist/*.whl
          python -I tools/smoke_wheel.py
          metaheuristics-run --version
          python -I -m metaheuristics --list
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  minimum-numpy:
    name: Minimum NumPy (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]" "numpy==1.24.0"
      - run: python -m pytest tests/ -q

